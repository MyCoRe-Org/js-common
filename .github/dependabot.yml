version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      - dependency-name: 'typescript'
        update-types:
          - version-update:semver-major
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
      npm:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      npm-major:
        patterns:
          - '*'
        update-types:
          - major
        group-by: dependency-name
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'
